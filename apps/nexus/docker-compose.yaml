name: nexus

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox:/etc/blackbox:ro
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"

  reyee-exporter:
    build:
      context: .
    image: nexus-runtime:local
    container_name: reyee-exporter
    restart: unless-stopped
    env_file:
      - ./secrets/login.env
    environment:
      EXPORTER_PORT: "9108"
      COLLECT_INTERVAL: "3"
      STATIC_COLLECT_INTERVAL: "30"
    ports:
      - "9108:9108"
    volumes:
      - ./reyee-exporter/reyee_exporter.py:/app/reyee_exporter.py:ro
      - ./reyee-exporter/event_store.py:/app/event_store.py:ro
      - ./events:/app/data
    command: ["python", "/app/reyee_exporter.py"]

  librespeed:
    image: linuxserver/librespeed:latest
    container_name: nexus-librespeed
    restart: unless-stopped

  network-dashboard:
    image: nexus-runtime:local
    container_name: network-dashboard
    restart: unless-stopped
    env_file:
      - ./secrets/login.env
    environment:
      DASHBOARD_PORT: "3001"
      PROMETHEUS_URL: http://prometheus:9090
      LIBRESPEED_URL: http://librespeed:80
      EVENT_DB_PATH: /app/events/events.db
    ports:
      - "3002:3001"
    volumes:
      - ./network-dashboard:/app/dashboard:ro
      - ./network-dashboard/dashboard_server.py:/app/dashboard_server.py:ro
      - ./events:/app/events:ro
    depends_on:
      - prometheus
      - librespeed
    command: ["python", "/app/dashboard_server.py"]

volumes:
  prometheus_data:
    name: monitoring_prometheus_data
